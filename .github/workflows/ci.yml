name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deepsearch
          POSTGRES_USER: deepsearch
          POSTGRES_PASSWORD: deepsearch_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepsearch -d deepsearch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://deepsearch:deepsearch_ci_password@127.0.0.1:5432/deepsearch
      DATA_DIR: /tmp/deepsearch-ci
      APP_ENV: test
      NOTIFICATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - run: python -m compileall backend/app scripts
      - name: Run backend tests
        run: PYTHONPATH=backend pytest -q backend/tests
      - name: Run deterministic search quality gate
        run: PYTHONPATH=backend pytest -q backend/quality_tests
      - name: Run multi-device E2E and chaos tests
        run: |
          rm -rf "$DATA_DIR"
          PYTHONPATH=backend pytest -q backend/integration_tests
      - name: Validate Docker Compose stacks
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.vpn.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
          python scripts/validate_production_env.py .env.example --example
      - name: Build VPN proxy sidecar
        run: docker build -t deep-search-egress-ci infra/egress

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.hai --project-name deep_search .
        working-directory: app
      - run: python scripts/prepare_platforms.py
      - name: Generate Android launcher assets
        run: |
          python -m pip install pillow
          python scripts/generate_icon.py
          test -f app/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f app/android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8000
      - name: Package Android RC artifact
        run: |
          cp app/build/app/outputs/flutter-apk/app-debug.apk deep-search-android-rc.apk
          sha256sum deep-search-android-rc.apk > deep-search-android-rc.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-rc
          retention-days: 7
          path: |
            deep-search-android-rc.apk
            deep-search-android-rc.apk.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name deep_search .
        working-directory: app
      - run: python scripts/prepare_platforms.py
      - name: Generate Windows icon assets
        shell: pwsh
        run: |
          python -m pip install pillow
          python scripts/generate_icon.py
          if (-not (Test-Path app\windows\runner\resources\app_icon.ico)) { throw "Windows icon missing" }
      - run: flutter pub get
        working-directory: app
      - name: Build Windows debug
        working-directory: app
        run: flutter build windows --debug --dart-define=API_BASE_URL=http://127.0.0.1:8000
      - name: Package Windows RC artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "app\build\windows\x64\runner\Debug\*" -DestinationPath deep-search-windows-rc.zip -Force
          $hash = (Get-FileHash deep-search-windows-rc.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  deep-search-windows-rc.zip" | Out-File -FilePath deep-search-windows-rc.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-rc
          retention-days: 7
          path: |
            deep-search-windows-rc.zip
            deep-search-windows-rc.zip.sha256
