name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to deploy"
        required: true
        default: "main"
        type: string
      bootstrap:
        description: "Bootstrap Docker on a fresh Ubuntu server (requires passwordless sudo)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
      DEPLOY_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH PRODUCTION_ENV_B64; do
            test -n "${!key}" || { echo "$key is required"; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid DEPLOY_HOST"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "Invalid DEPLOY_USER"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/opt/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_PATH must be under /opt"; exit 1; }
          [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy ref"; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Bootstrap fresh server
        if: ${{ inputs.bootstrap }}
        shell: bash
        run: |
          cat scripts/bootstrap_server.sh | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s -- '$DEPLOY_USER'"

      - name: Checkout requested revision on server
        id: checkout
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST")
          "${SSH[@]}" "mkdir -p '$DEPLOY_PATH'"
          if ! "${SSH[@]}" "test -d '$DEPLOY_PATH/.git'"; then
            "${SSH[@]}" "git clone https://github.com/${GITHUB_REPOSITORY}.git '$DEPLOY_PATH'"
          fi
          PREVIOUS_SHA="$("${SSH[@]}" "cd '$DEPLOY_PATH' && git rev-parse HEAD 2>/dev/null || true")"
          "${SSH[@]}" "cd '$DEPLOY_PATH' && git fetch --prune origin '$DEPLOY_REF' && git reset --hard FETCH_HEAD"
          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"

      - name: Install production environment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PRODUCTION_ENV_B64" | base64 --decode | \
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '$DEPLOY_PATH/.env'"

      - name: Deploy and verify HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash scripts/deploy_server.sh '${{ steps.checkout.outputs.previous_sha }}'"
