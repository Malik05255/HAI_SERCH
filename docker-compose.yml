services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deepsearch
      POSTGRES_USER: deepsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepsearch_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsearch -d deepsearch"]
      interval: 10s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m

  vision:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - -hf
      - ggml-org/SmolVLM-256M-Instruct-GGUF:Q8_0
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - -c
      - "2048"
      - -np
      - "1"
    volumes:
      - vision_cache:/root/.cache
    mem_limit: 1200m

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      vision:
        condition: service_started
    mem_limit: 3g

volumes:
  pgdata:
  vision_cache:
