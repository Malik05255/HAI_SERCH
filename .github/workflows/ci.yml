name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall backend/app scripts

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name deep_search .
        working-directory: app
      - run: python scripts/prepare_platforms.py
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8000

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=windows --project-name deep_search .
        working-directory: app
      - run: python scripts/prepare_platforms.py
      - run: flutter pub get
        working-directory: app
      - name: Build Windows debug
        working-directory: app
        run: flutter build windows --debug --dart-define=API_BASE_URL=http://127.0.0.1:8000
