User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 45
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Warning
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 24
StartServers 2
MinSpareServers 2
MaxSpareServers 6
DisableViaHeader Yes

# Only private Docker/LAN source ranges may use this proxy.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

ConnectPort 443
ConnectPort 80
