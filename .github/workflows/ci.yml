name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - run: python -m compileall backend/app scripts
      - name: Run backend tests
        run: PYTHONPATH=backend pytest -q backend/tests
      - name: Validate Docker Compose stacks
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.vpn.yml config >/dev/null
      - name: Build VPN proxy sidecar
        run: docker build -t deep-search-egress-ci infra/egress

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.hai --project-name deep_search .
        working-directory: app
      - run: python scripts/prepare_platforms.py
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8000

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name deep_search .
        working-directory: app
      - run: python scripts/prepare_platforms.py
      - run: flutter pub get
        working-directory: app
      - name: Build Windows debug
        working-directory: app
        run: flutter build windows --debug --dart-define=API_BASE_URL=http://127.0.0.1:8000
