name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_PATH: release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.hai --project-name deep_search .
        working-directory: app
      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is required" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > app/android/app/release.jks
      - run: python -m pip install pillow
      - run: python scripts/prepare_platforms.py
      - run: python scripts/generate_icon.py
      - run: flutter pub get
        working-directory: app
      - name: Build APK
        working-directory: app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
      - run: cp app/build/app/outputs/flutter-apk/app-release.apk deep-search-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: deep-search-android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=windows --project-name deep_search .
        working-directory: app
      - run: python -m pip install pillow
      - run: python scripts/prepare_platforms.py
      - run: python scripts/generate_icon.py
      - run: flutter pub get
        working-directory: app
      - name: Build Windows
        working-directory: app
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          flutter build windows --release --build-name=$version --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\windows.iss
          Copy-Item installer\dist\deep-search-windows-setup.exe deep-search-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: deep-search-windows-setup.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deep-search-android.apk
            dist/deep-search-windows-setup.exe
