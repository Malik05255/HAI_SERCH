name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      MANUAL_VERSION: ${{ inputs.version }}
    steps:
      - id: meta
        name: Resolve and validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$MANUAL_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release version must look like v1.2.3"
            exit 1
          }
          for key in \
            API_BASE_URL \
            ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD \
            FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID
          do
            test -n "${!key}" || {
              echo "$key is required for a production release"
              exit 1
            }
          done
          [[ "$API_BASE_URL" == https://* ]] || {
            echo "API_BASE_URL must use HTTPS in production"
            exit 1
          }
          [[ "$API_BASE_URL" != */ ]] || {
            echo "API_BASE_URL must not end with a slash"
            exit 1
          }
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* || "$TAG" == *-beta.* || "$TAG" == *-alpha.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_PATH: release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.hai --project-name deep_search .
        working-directory: app
      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > app/android/app/release.jks
      - run: python -m pip install pillow
      - run: python scripts/prepare_platforms.py
      - name: Generate and verify Android identity assets
        run: |
          python scripts/generate_icon.py
          test -f app/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f app/android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.hai.deep_search"' app/android/app/build.gradle.kts
      - run: flutter pub get
        working-directory: app
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
      - name: Build signed APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE_URL=${{ secrets.API_BASE_URL }}" \
            --dart-define="FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define="FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define="FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}"
      - name: Prepare Android release assets
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk deep-search-android.apk
          sha256sum deep-search-android.apk > deep-search-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            deep-search-android.apk
            deep-search-android.apk.sha256

  windows:
    needs: validate
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name deep_search .
        working-directory: app
      - run: python -m pip install pillow
      - run: python scripts/prepare_platforms.py
      - name: Generate and verify Windows identity assets
        shell: pwsh
        run: |
          python scripts/generate_icon.py
          if (-not (Test-Path app\windows\runner\resources\app_icon.ico)) { throw "Windows icon missing" }
      - run: flutter pub get
        working-directory: app
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
      - name: Build Windows
        working-directory: app
        shell: pwsh
        run: flutter build windows --release --build-name=$env:RELEASE_VERSION --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:RELEASE_VERSION" installer\windows.iss
          Copy-Item installer\dist\deep-search-windows-setup.exe deep-search-windows-setup.exe
          $hash = (Get-FileHash deep-search-windows-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  deep-search-windows-setup.exe" | Out-File -FilePath deep-search-windows-setup.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            deep-search-windows-setup.exe
            deep-search-windows-setup.exe.sha256

  publish:
    needs: [validate, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: البحث العميق ${{ needs.validate.outputs.release_tag }}
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: |
            dist/deep-search-android.apk
            dist/deep-search-android.apk.sha256
            dist/deep-search-windows-setup.exe
            dist/deep-search-windows-setup.exe.sha256
